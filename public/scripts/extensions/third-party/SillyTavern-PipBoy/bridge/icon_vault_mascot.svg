<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Vault-style mascot extension icon</title>
  <desc id="desc">A cheerful retro-futurist vault mascot face inside a cog badge, suitable for a browser extension icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29434e"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d65b"/>
      <stop offset="100%" stop-color="#c89a1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- outer cog badge -->
  <g filter="url(#shadow)">
    <path fill="url(#rim)" d="M64 6l8 6 10-2 5 9 10 2v11l8 6-4 10 4 10-8 6v11l-10 2-5 9-10-2-8 6-8-6-10 2-5-9-10-2V70l-8-6 4-10-4-10 8-6V21l10-2 5-9 10 2 8-6z"/>
    <circle cx="64" cy="64" r="45" fill="url(#bg)"/>
    <circle cx="64" cy="64" r="41" fill="#18323a" stroke="#f1cf54" stroke-width="2"/>
  </g>

  <!-- little bridge nodes -->
  <g>
    <circle cx="23" cy="64" r="7" fill="#71e36a" stroke="#d8ffd5" stroke-width="2"/>
    <circle cx="105" cy="64" r="7" fill="#71e36a" stroke="#d8ffd5" stroke-width="2"/>
    <rect x="28" y="61.5" width="72" height="5" rx="2.5" fill="#71e36a" opacity="0.85"/>
  </g>

  <!-- mascot head -->
  <g transform="translate(0,2)">
    <ellipse cx="64" cy="62" rx="24" ry="28" fill="#f7d7ae"/>

    <!-- hair -->
    <path fill="#f5c841" d="M40 54c1-14 11-25 24-25 10 0 19 6 23 16-5-3-10-4-15-4-6 0-11 1-17 4-4 2-8 6-15 9z"/>
    <path fill="#f5c841" d="M83 45c7 7 9 19 5 28-2-6-4-9-7-12-1-5-1-10 2-16z"/>

    <!-- ear -->
    <circle cx="86" cy="62" r="4" fill="#f2c999"/>

    <!-- eyes -->
    <ellipse cx="56" cy="58" rx="3.5" ry="5" fill="#16262d"/>
    <ellipse cx="70" cy="58" rx="3.5" ry="5" fill="#16262d"/>
    <circle cx="57" cy="56.5" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="71" cy="56.5" r="1" fill="#fff" opacity="0.8"/>

    <!-- brows -->
    <path d="M50 50c3-2 8-2 11 0" stroke="#996d22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M67 50c3-2 8-2 11 0" stroke="#996d22" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M64 58c-1 3-1 6 1 8" stroke="#d2a476" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- smile -->
    <path d="M53 71c4 5 18 5 22 0" stroke="#8a4f35" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- jaw highlight -->
    <path d="M47 68c2 9 8 14 17 14 8 0 15-5 17-13" stroke="#fbe7cb" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- subtle V badge -->
  <g transform="translate(64,98)">
    <circle r="11" fill="#0f2027" stroke="#f1cf54" stroke-width="2"/>
    <path d="M-4-3l4 8 4-8" fill="none" stroke="#f1cf54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
